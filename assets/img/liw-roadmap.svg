		<text x="100" y="82" font-size="11" fill="var(--ary-card, #FFFFFF)" fill-opacity="0.85">Phase 1</text>
		<text x="100" y="101" font-size="13" font-weight="700" fill="var(--ary-card, #FFFFFF)">Contract Model</text>
