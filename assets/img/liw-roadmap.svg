		<text x="550" y="231" font-size="13" font-weight="700" fill="var(--ary-text, #24302A)">Pilot Dealer</text>
		<circle cx="700" cy="150" r="14" fill="var(--ary-accent, #61735F)" stroke="var(--ary-card, #FFFFFF)" stroke-width="3" />
		<rect x="632" y="60" width="136" height="54" rx="10" fill="var(--ary-accent, #61735F)" />
