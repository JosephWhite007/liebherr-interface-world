		<text x="250" y="231" font-size="13" font-weight="700" fill="var(--ary-text, #24302A)">Magic Cube</text>
		<circle cx="400" cy="150" r="14" fill="var(--ary-accent, #61735F)" stroke="var(--ary-card, #FFFFFF)" stroke-width="3" />
		<rect x="332" y="60" width="136" height="54" rx="10" fill="var(--ary-accent, #61735F)" />
		<text x="400" y="82" font-size="11" fill="var(--ary-card, #FFFFFF)" fill-opacity="0.85">Phase 3</text>
		<text x="400" y="101" font-size="13" font-weight="700" fill="var(--ary-card, #FFFFFF)">Sandbox Validation</text>
		<circle cx="550" cy="150" r="14" fill="var(--ary-highlight, #B6A27A)" stroke="var(--ary-card, #FFFFFF)" stroke-width="3" />
		<rect x="482" y="190" width="136" height="54" rx="10" fill="var(--ary-highlight, #B6A27A)" />
