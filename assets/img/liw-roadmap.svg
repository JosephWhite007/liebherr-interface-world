	<defs><marker id="liw-rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ary-accent, #61735F)" /></marker></defs>
	<line x1="60" y1="150" x2="950" y2="150" stroke="var(--ary-accent, #61735F)" stroke-width="3" marker-end="url(#liw-rm-arrow)" />
	<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
