<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="liw-rm-title liw-rm-desc" class="liw-graphic liw-graphic--roadmap" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
	<title id="liw-rm-title">Interface World Connections – Roadmap (LP-12)</title>
	<desc id="liw-rm-desc">Sechs Phasen in Reihenfolge: Contract Model, Magic Cube, Sandbox Validation, Pilot Dealer, Interface LogiQ, Global Rollout. Rein schematische Darstellung ohne Termine.</desc>
