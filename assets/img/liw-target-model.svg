<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="liw-tm-title liw-tm-desc" class="liw-graphic liw-graphic--target-model" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
	<title id="liw-tm-title">Interface World Connections – Zielbild (LP-03)</title>
	<desc id="liw-tm-desc">Einheitliche Liebherr-Referenzstruktur als verbindende Schicht: ein zentrales System links, Interface LogiQ als Vermittlungs-, Prüf- und Übersetzungsschicht in der Mitte, lokale Händler-, Lieferanten- und Kundensysteme rechts. Rein schematische Darstellung ohne reale System- oder Schnittstellennamen.</desc>
	<rect x="0" y="0" width="1000" height="420" fill="var(--ary-bg, #F7F5F1)" />
	<defs><marker id="liw-tm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ary-accent, #61735F)" /></marker></defs>
	<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
		<rect x="60" y="150" width="200" height="120" rx="12" fill="var(--ary-card, #FFFFFF)" stroke="var(--ary-accent, #61735F)" stroke-width="2" />
		<text x="160" y="200" font-size="18" font-weight="700" fill="var(--ary-text, #24302A)">Zentral-System</text>
		<text x="160" y="226" font-size="13" fill="var(--ary-text, #24302A)" fill-opacity="0.7">Liebherr-Referenzstruktur</text>
		<rect x="390" y="120" width="220" height="180" rx="16" fill="var(--ary-accent, #61735F)" />
		<text x="500" y="185" font-size="22" font-weight="700" fill="var(--ary-card, #FFFFFF)">Interface LogiQ</text>
		<text x="500" y="218" font-size="13" fill="var(--ary-card, #FFFFFF)" fill-opacity="0.9">Vermittlung</text>
		<text x="500" y="240" font-size="13" fill="var(--ary-card, #FFFFFF)" fill-opacity="0.9">Prüfung</text>
		<text x="500" y="262" font-size="13" fill="var(--ary-card, #FFFFFF)" fill-opacity="0.9">Übersetzung</text>
		<rect x="740" y="80" width="200" height="60" rx="10" fill="var(--ary-card, #FFFFFF)" stroke="var(--ary-highlight, #B6A27A)" stroke-width="2" />
		<text x="840" y="116" font-size="15" font-weight="700" fill="var(--ary-text, #24302A)">Händler-Systeme</text>
		<rect x="740" y="180" width="200" height="60" rx="10" fill="var(--ary-card, #FFFFFF)" stroke="var(--ary-highlight, #B6A27A)" stroke-width="2" />
		<text x="840" y="216" font-size="15" font-weight="700" fill="var(--ary-text, #24302A)">Lieferanten-Systeme</text>
		<rect x="740" y="280" width="200" height="60" rx="10" fill="var(--ary-card, #FFFFFF)" stroke="var(--ary-highlight, #B6A27A)" stroke-width="2" />
		<text x="840" y="316" font-size="15" font-weight="700" fill="var(--ary-text, #24302A)">Kunden-Systeme</text>
	</g>
	<line x1="262" y1="200" x2="388" y2="200" stroke="var(--ary-accent, #61735F)" stroke-width="3" marker-start="url(#liw-tm-arrow)" marker-end="url(#liw-tm-arrow)" />
	<text x="325" y="188" font-size="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="var(--ary-text, #24302A)" fill-opacity="0.7">ein Datenmodell</text>
	<path d="M612,170 C680,170 680,110 738,110" fill="none" stroke="var(--ary-accent, #61735F)" stroke-width="3" marker-end="url(#liw-tm-arrow)" />
	<path d="M612,210 C680,210 680,210 738,210" fill="none" stroke="var(--ary-accent, #61735F)" stroke-width="3" marker-end="url(#liw-tm-arrow)" />
	<path d="M612,250 C680,250 680,310 738,310" fill="none" stroke="var(--ary-accent, #61735F)" stroke-width="3" marker-end="url(#liw-tm-arrow)" />
	<text x="500" y="370" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="var(--ary-text, #24302A)" fill-opacity="0.7">Jede lokale Anbindung spricht nur mit Interface LogiQ – nie direkt mit dem Zentral-System.</text>
</svg>
