name: 🚀 Deploy to GoHeal (goheal.world)

# ─────────────────────────────────────────────────────────────────────────────
# Liebherr Interface Solutions (liebherr-interface-world) – GoHeal-Deploy nach Core-Muster
# (araliya-platform-core/.github/workflows/deploy-goheal.yml, Entscheidung Joseph White 01.11.2026, LIW alpha.171).
#
# Trigger: AUSSCHLIESSLICH manuell (workflow_dispatch). Kein Push löst dieses Ziel aus.
# Ziel:    goheal.world (OVHcloud) – direkt aus dem gewählten Branch (Standard master), ohne Staging-Stufe.
#          Schutz: Pflichteingabe confirm = DEPLOY-GOHEAL, PHP-Lint vor dem Upload, Wartungsmodus, Upload nach .new,
#          atomarer Wechsel mit Rollback-Kopie .prev, Versionsprüfung, Startseiten-Check.
#
# Benötigte Secrets im GitHub Environment "goheal" DIESES Repos (Werte wie im Core-Repo, nur TARGET anders):
#   GOHEAL_SFTP_HOST      Host (z. B. ftp.clusterNNN.hosting.ovh.net)
#   GOHEAL_SFTP_PORT      22 für SFTP (Standard), 21 für FTP/FTPS
#   GOHEAL_PROTOCOL       sftp (Standard) | ftps | ftp  – optional
#   GOHEAL_SFTP_USER      Benutzername
#   GOHEAL_SFTP_PASSWORD  Passwort
#   GOHEAL_SFTP_TARGET    Absoluter Pfad, z. B. /home/<user>/www/wp-content/plugins/liebherr-interface-world
#
# Nicht Bestandteil: Core-Plugin (eigenes Repo), wp-config.php, mu-plugins, Uploads, Datenbank.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Zur Bestätigung exakt DEPLOY-GOHEAL eingeben'
        required: true
        type: string
      ref:
        description: 'Branch oder Tag, der deployt wird (Standard master)'
        required: false
        type: string
        default: 'master'

concurrency:
  group: deploy-goheal
  cancel-in-progress: false

jobs:

  guard:
    name: Bestätigung prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: confirm-Eingabe validieren
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY-GOHEAL" ]; then
            echo "❌ Abbruch: Bestätigung fehlt oder ist falsch."
            echo "   Zum Deployen im Feld 'confirm' exakt DEPLOY-GOHEAL eingeben."
            exit 1
          fi
          echo "✅ Bestätigung korrekt"
          echo "ℹ️ Quelle: ${{ inputs.ref || 'master' }} (kein Staging)"

  deploy:
    name: Plugin packen & Upload (goheal.world)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: goheal
      url: https://goheal.world

    steps:

      - name: Checkout ${{ inputs.ref || 'master' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'master' }}

      - name: Version prüfen
        run: |
          VERSION=$(grep -m1 "Version:" liebherr-interface-world.php | awk '{print $NF}')
          DEFINED=$(sed -n "s/^define( 'LIW_VERSION', '\([^']*\)' );/\1/p" liebherr-interface-world.php)
          if [ -z "$VERSION" ] || [ "$VERSION" != "$DEFINED" ]; then
            echo "❌ Plugin-Header ($VERSION) und LIW_VERSION ($DEFINED) stimmen nicht überein"; exit 1
          fi
          echo "🔖 Deploying Plugin Version: $VERSION"
          echo "PLUGIN_VERSION=$VERSION" >> $GITHUB_ENV

      - name: PHP-Syntax prüfen (Lint)
        run: |
          COUNT=$(find . -path ./.git -prune -o -name '*.php' -print | wc -l)
          echo "🔎 Lint: $COUNT PHP-Dateien"
          find . -path ./.git -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P8 php -l 2>&1 | grep -v '^No syntax errors' > /tmp/lint.txt || true
          if [ -s /tmp/lint.txt ]; then cat /tmp/lint.txt; echo "❌ Syntaxfehler – Abbruch vor dem Upload"; exit 1; fi
          echo "✅ keine Syntaxfehler"

      - name: Deployment-Kopie erstellen
        run: |
          mkdir -p /tmp/liw-deploy
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.claude/' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='COMMIT_MSG.txt' \
            --exclude='tests/' \
            --exclude='scripts/commit.sh' \
            --exclude='scripts/deploy.sh' \
            --exclude='scripts/liw-seed-*.php' \
            --exclude='scripts/liw-selftest.php' \
            --exclude='data/*.xlsx' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            . /tmp/liw-deploy/
          echo "📦 Dateien im Deployment-Paket: $(find /tmp/liw-deploy -type f | wc -l)"

      # ── [alpha.181] Secrets-Vorprüfung: Lauf #1 (02.11.2026) brach in den SFTP-Schritten ohne lesbare Ursache ab.
      #    Secrets gelten je Repo – das Environment "goheal" dieses Repos muss sie selbst tragen. Werte werden nie ausgegeben.
      - name: Secrets prüfen (Environment goheal dieses Repos)
        env:
          SFTP_HOST:        ${{ secrets.GOHEAL_SFTP_HOST }}
          SFTP_USER:        ${{ secrets.GOHEAL_SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.GOHEAL_SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.GOHEAL_SFTP_TARGET }}
        run: |
          MISSING=""
          [ -z "$SFTP_HOST" ]        && MISSING="$MISSING GOHEAL_SFTP_HOST"
          [ -z "$SFTP_USER" ]        && MISSING="$MISSING GOHEAL_SFTP_USER"
          [ -z "$SFTP_PASSWORD" ]    && MISSING="$MISSING GOHEAL_SFTP_PASSWORD"
          [ -z "$SFTP_REMOTE_PATH" ] && MISSING="$MISSING GOHEAL_SFTP_TARGET"
          if [ -n "$MISSING" ]; then
            echo "❌ Fehlende Secrets im Environment 'goheal' DIESES Repos (liebherr-interface-world):$MISSING"
            echo "   GitHub → Settings → Environments → goheal → Environment secrets anlegen."
            echo "   Werte wie im Core-Repo araliya-platform-core; nur GOHEAL_SFTP_TARGET anders:"
            echo "   .../wp-content/plugins/liebherr-interface-world"
            exit 1
          fi
          # [alpha.183] Tolerant: Schrägstrich am Ende erlaubt; nur die letzten zwei Pfadsegmente werden gezeigt (kein Host, kein Benutzer).
          P="${SFTP_REMOTE_PATH%/}"
          TAIL="$(basename "$(dirname "$P")")/$(basename "$P")"
          echo "ℹ️ Zielpfad endet auf: …/$TAIL"
          case "$P" in
            */plugins/liebherr-interface-world) echo "✅ Secrets vorhanden, Zielpfad zeigt auf plugins/liebherr-interface-world" ;;
            */plugins/araliya-platform-core) echo "❌ GOHEAL_SFTP_TARGET zeigt auf den Core-Ordner – für dieses Repo muss er auf …/plugins/liebherr-interface-world enden"; exit 1 ;;
            *) echo "❌ GOHEAL_SFTP_TARGET muss auf …/plugins/liebherr-interface-world enden (ist: …/$TAIL)"; exit 1 ;;
          esac

      - name: lftp installieren
        run: sudo apt-get install -y lftp

      - name: Wartungsmodus aktivieren
        env:
          SFTP_HOST:        ${{ secrets.GOHEAL_SFTP_HOST }}
          SFTP_PROTO:       ${{ secrets.GOHEAL_PROTOCOL || 'sftp' }}
          SFTP_USER:        ${{ secrets.GOHEAL_SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.GOHEAL_SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.GOHEAL_SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ secrets.GOHEAL_SFTP_TARGET }}
        run: |
          printf '<?php $upgrading = %s; ?>\n' "$(date +%s)" > /tmp/.maintenance
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "$SFTP_PROTO"://"$SFTP_HOST":"$SFTP_PORT" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          cd $SFTP_REMOTE_PATH/../../..
          put /tmp/.maintenance -o .maintenance
          bye
          LFTP
          echo "🛠️ .maintenance gesetzt"
          echo "MAINTENANCE_SET=1" >> $GITHUB_ENV

      - name: Upload per SFTP (mirror → .new)
        env:
          SFTP_HOST:        ${{ secrets.GOHEAL_SFTP_HOST }}
          SFTP_PROTO:       ${{ secrets.GOHEAL_PROTOCOL || 'sftp' }}
          SFTP_USER:        ${{ secrets.GOHEAL_SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.GOHEAL_SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.GOHEAL_SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ secrets.GOHEAL_SFTP_TARGET }}
        run: |
          NAME="$(basename "$SFTP_REMOTE_PATH")"
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "$SFTP_PROTO"://"$SFTP_HOST":"$SFTP_PORT" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          mirror --reverse --delete --verbose=1 --parallel=4 /tmp/liw-deploy $SFTP_REMOTE_PATH/../../$NAME.new
          bye
          LFTP
          echo "📤 Plugin nach wp-content/$NAME.new hochgeladen"

      - name: Plugin-Verzeichnis umschalten
        env:
          SFTP_HOST:        ${{ secrets.GOHEAL_SFTP_HOST }}
          SFTP_PROTO:       ${{ secrets.GOHEAL_PROTOCOL || 'sftp' }}
          SFTP_USER:        ${{ secrets.GOHEAL_SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.GOHEAL_SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.GOHEAL_SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ secrets.GOHEAL_SFTP_TARGET }}
        run: |
          NAME="$(basename "$SFTP_REMOTE_PATH")"
          PARENT="$(dirname "$SFTP_REMOTE_PATH")"          # …/wp-content/plugins
          WPC="$(dirname "$PARENT")"                       # …/wp-content
          run_lftp() {
            lftp -u "$SFTP_USER","$SFTP_PASSWORD" "$SFTP_PROTO"://"$SFTP_HOST":"$SFTP_PORT" -e "set sftp:auto-confirm yes; set net:max-retries 3; set cmd:fail-exit yes; $1; bye"
          }
          exists() { run_lftp "cls -1 $1" >/dev/null 2>&1; }
          remove_dir() {
            mkdir -p /tmp/ary-empty
            run_lftp "set cmd:fail-exit no; mirror --reverse --delete --parallel=8 --no-perms /tmp/ary-empty $1" || true
            run_lftp "rm -rf $1" || true
          }
          remote_version() { run_lftp "cat $1/liebherr-interface-world.php" 2>/dev/null | grep -m1 'Version:' | awk '{print $NF}'; }

          if ! exists "$WPC/$NAME.new/liebherr-interface-world.php"; then
            echo "❌ $WPC/$NAME.new fehlt – Upload unvollständig"; exit 1
          fi
          NEWV="$(remote_version "$WPC/$NAME.new")"
          if [ "$NEWV" != "$PLUGIN_VERSION" ]; then
            echo "❌ Version in .new ($NEWV) ≠ Deploy-Version ($PLUGIN_VERSION)"; exit 1
          fi
          for OLD in "$WPC/$NAME.prev" "$WPC/$NAME.prev2"; do
            if exists "$OLD"; then
              remove_dir "$OLD"
              if exists "$OLD"; then echo "❌ $OLD konnte nicht entfernt werden – Umschalten abgebrochen (Live unverändert)"; exit 1; fi
            fi
          done
          if exists "$SFTP_REMOTE_PATH"; then
            run_lftp "mv $SFTP_REMOTE_PATH $WPC/$NAME.prev" || { echo "❌ live → .prev fehlgeschlagen (Live unverändert)"; exit 1; }
            if exists "$SFTP_REMOTE_PATH"; then echo "❌ Live-Ordner existiert nach mv weiterhin – abgebrochen"; exit 1; fi
          else
            echo "ℹ️ kein bisheriges Plugin-Verzeichnis (Erstdeploy – Plugin danach im Backend aktivieren)"
          fi
          rollback() { run_lftp "mv $WPC/$NAME.prev $SFTP_REMOTE_PATH" && echo "↩️ Rollback auf vorherige Version" || echo "‼️ Rollback fehlgeschlagen – manuell: mv $WPC/$NAME.prev $SFTP_REMOTE_PATH"; }
          if ! run_lftp "mv $WPC/$NAME.new $SFTP_REMOTE_PATH"; then
            echo "❌ Umschalten fehlgeschlagen"; rollback; exit 1
          fi
          LIVEV="$(remote_version "$SFTP_REMOTE_PATH")"
          if [ "$LIVEV" != "$PLUGIN_VERSION" ] || exists "$WPC/$NAME.new"; then
            echo "❌ Verifikation fehlgeschlagen: live=$LIVEV erwartet=$PLUGIN_VERSION"
            remove_dir "$SFTP_REMOTE_PATH"
            rollback; exit 1
          fi
          echo "🔁 Plugin umgeschaltet auf $LIVEV — vorherige Version liegt in $WPC/$NAME.prev (Rollback: mv)"

          COREV="$(run_lftp "cat $PARENT/araliya-platform-core/araliya-platform-core.php" 2>/dev/null | grep -m1 'Version:' | awk '{print $NF}')"
          if [ -z "$COREV" ]; then
            echo "⚠️ Core-Plugin unter $PARENT/araliya-platform-core nicht gefunden – LIW bleibt ohne Core inaktiv"
          else
            echo "ℹ️ Core-Plugin auf dem Ziel: $COREV (LIW alpha.170+ braucht Core ≥ alpha.815 für die Katalogquelle)"
          fi

      # [alpha.182] Nur wenn .maintenance wirklich gesetzt wurde – sonst lief lftp nach einem frühen Abbruch
      #             (Lauf #2: Secrets-Prüfung rot) ohne Installation und meldete Exit 127 als zweiten, irreführenden Fehler.
      - name: Wartungsmodus beenden
        if: always() && env.MAINTENANCE_SET == '1'
        env:
          SFTP_HOST:        ${{ secrets.GOHEAL_SFTP_HOST }}
          SFTP_PROTO:       ${{ secrets.GOHEAL_PROTOCOL || 'sftp' }}
          SFTP_USER:        ${{ secrets.GOHEAL_SFTP_USER }}
          SFTP_PASSWORD:    ${{ secrets.GOHEAL_SFTP_PASSWORD }}
          SFTP_PORT:        ${{ secrets.GOHEAL_SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ secrets.GOHEAL_SFTP_TARGET }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "$SFTP_PROTO"://"$SFTP_HOST":"$SFTP_PORT" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          cd $SFTP_REMOTE_PATH/../../..
          rm -f .maintenance
          bye
          LFTP
          echo "✅ .maintenance entfernt"

      - name: Startseite prüfen (HTTP)
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "https://goheal.world/?deploycheck=$(date +%s)" || echo 000)
            echo "Versuch $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "✅ goheal.world antwortet"; exit 0; fi
            sleep 10
          done
          echo "❌ goheal.world antwortet nicht mit 200 – Rollback prüfen (wp-content/liebherr-interface-world.prev)"
          exit 1

      - name: Deployment-Summary
        if: success()
        run: |
          echo "✅ LIW-Deploy GoHeal erfolgreich"
          echo "   Version:     $PLUGIN_VERSION"
          echo "   Ziel:        https://goheal.world"
          echo ""
          echo "⚠️  Manuelle Nacharbeiten (WP Admin goheal.world):"
          echo "   1. Plugins → „Liebherr Interface Solutions“ aktiv? (Erstdeploy: aktivieren)"
          echo "   2. WP Rocket: Clear cache"
          echo "   3. Articlebook Construction → Katalog: Quelle „Liebherr Produktvorlagen“ sichtbar?"

      - name: Fehler-Hinweis
        if: failure()
        run: |
          echo "❌ LIW-Deploy GoHeal fehlgeschlagen"
          echo "   Häufige Ursachen:"
          echo "   - Environment 'goheal' oder GOHEAL_SFTP_*-Secrets in DIESEM Repo nicht angelegt"
          echo "   - Protokoll/Port passen nicht (GOHEAL_PROTOCOL: sftp|ftps|ftp, GOHEAL_SFTP_PORT)"
          echo "   - GOHEAL_SFTP_TARGET endet nicht auf .../plugins/liebherr-interface-world"
